name: Apply note ingestion frontend
on:
  push:
    branches: [feature/ai-note-ingestion]
    paths:
      - scripts/apply_note_ingestion_frontend.py
      - .github/workflows/apply-note-ingestion-frontend.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-note-ingestion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_note_ingestion_frontend.py
      - name: Commit generated frontend changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/pages/Tools.tsx
          git diff --cached --quiet || git commit -m "Wire note scanning into study tools"
          git push
