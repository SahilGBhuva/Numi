name: Run note ingestion migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/run-note-ingestion-migration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-note-ingestion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_note_ingestion_frontend.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/pages/Tools.tsx
          git diff --cached --quiet || git commit -m "Wire note scanning into study tools"
          git push origin HEAD:feature/ai-note-ingestion
